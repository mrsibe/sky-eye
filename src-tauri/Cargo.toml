[package]
name = "sky-eye"
version = "0.2.4"
description = "A Tauri App"
authors = ["you"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sky_eye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["cfitsio-backend"]
cfitsio-backend = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.17.2"
num-traits = "0.2"
imageproc = "0.27"
tauri-plugin-dialog = "2.7.1"
fitsio = { version = "0.21.10", features = ["array", "fitsio-src", "src-cmake"] }
fitsio-sys = "0.5.7"
sep-sys = "1.3.0"
erfars = "0.2.0"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing", "serde"] }
nalgebra = { version = "0.34", features = ["serde-serialize"] }
delaunator = "1.1"
rayon = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
bitflags = { version = "2", features = ["serde"] }
log = { version = "0.4", features = ["std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "form", "query", "json"] }
flate2 = "1"
bincode = { version = "2", features = ["serde"] }
bytemuck = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "sync", "time"] }
tokio-util = "0.7"
